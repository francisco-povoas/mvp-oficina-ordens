name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      PYTHONPATH: src
      DATABASE_URL: postgresql+asyncpg://ordens_ci:ordens_ci@127.0.0.1:5432/ordens_ci
      JWT_SECRET_KEY: chave-ficticia-exclusiva-para-ci
      JWT_ALGORITHM: HS256
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local-only-elasticmq
      AWS_SECRET_ACCESS_KEY: local-only-elasticmq
      SQS_ENDPOINT_URL: http://127.0.0.1:9324
      SQS_ORDENS_TO_RECURSOS_URL: http://127.0.0.1:9324/000000000000/mvp-oficina-ordens-to-recursos-local.fifo
      SQS_RECURSOS_TO_ORDENS_URL: http://127.0.0.1:9324/000000000000/mvp-oficina-recursos-to-ordens-local.fifo
      SQS_FINANCEIRO_TO_ORDENS_URL: http://127.0.0.1:9324/000000000000/mvp-oficina-financeiro-to-ordens-local.fifo
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ordens_ci
          POSTGRES_USER: ordens_ci
          POSTGRES_PASSWORD: ordens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ordens_ci -d ordens_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check src tests
      - name: Unit tests
        run: python -m pytest tests/unit
      - name: Contract tests
        run: python -m pytest tests/contracts
      - name: PostgreSQL and ElasticMQ integration tests
        run: python -m pytest tests/integration
      - name: Full suite and coverage gate
        run: python -m pytest --cov=src/app --cov-report=term-missing
      - name: Build runtime image
        run: docker build --target runtime -t mvp-oficina-ordens:${{ github.sha }} .
