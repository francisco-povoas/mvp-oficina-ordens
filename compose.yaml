services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ordens
      POSTGRES_USER: ordens
      POSTGRES_PASSWORD: ordens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordens -d ordens"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5438:5432"
    volumes:
      - ordens_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: runtime
    environment:
      ENVIRONMENT: dev
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://ordens:ordens@db:5432/ordens
      JWT_SECRET_KEY: chave-local-nao-usar-em-producao
      JWT_ALGORITHM: HS256
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ordens_data:
