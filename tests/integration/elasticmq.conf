include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

generate-node-address = false

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  "mvp-oficina-ordens-to-recursos-local-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = false
  }
  "mvp-oficina-ordens-to-recursos-local.fifo" {
    defaultVisibilityTimeout = 60 seconds
    fifo = true
    contentBasedDeduplication = false
    deadLettersQueue {
      name = "mvp-oficina-ordens-to-recursos-local-dlq.fifo"
      maxReceiveCount = 5
    }
  }
}
